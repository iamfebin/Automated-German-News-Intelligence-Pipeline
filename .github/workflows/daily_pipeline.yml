name: Daily German News Intelligence Pipeline

on:
  schedule:
    - cron: '17 6 * * *' # Every day at 6:17 AM UTC (off-peak to avoid runner queue delays)
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 7 # Automatically cancels the job if it hangs past 7 minutes
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Cache Hugging Face models to speed up workflows
      - name: Cache Hugging Face Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-cache-${{ hashFiles('requirements_etl.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-cache-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_etl.txt
      - name: Run ETL Pipeline
        env:
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          SCRAPER_LIMIT_PER_FEED: 10
        run: |
          python src/job_etl.py

      # Automatically keep scheduled workflow active using GitHub REST API
      - name: Keepalive Workflow via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "/repos/${{ github.repository }}/actions/workflows/daily_pipeline.yml/enable" || true



